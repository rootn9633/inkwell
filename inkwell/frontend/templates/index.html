<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkwell</title>
  <script defer src="{{ base }}/static/alpine.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; display: grid; place-items: center; min-height: 100vh;
    }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    .msg { font-size: 1.1rem; }
    .muted { opacity: .6; font-size: .9rem; margin-top: 1.5rem; }
    code { background: rgba(127,127,127,.2); padding: .1rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <main x-data="{ msg: 'The add-on is running \u{1F389}' }">
    <h1>Inkwell</h1>
    <p class="msg" x-text="msg">Loading…</p>
    <p class="muted">
      Phase 1 — ingress skeleton. Base path: <code>{{ base or '/' }}</code>
    </p>
  </main>
</body>
</html>
